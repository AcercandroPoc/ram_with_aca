[package]
name = "tesis_ram"
version = "0.1.0"
edition = "2024"
authors = ["Salas Nuñez José Alejandro"]
description = "Simulador multiescala estocástico de resistencia antimicrobiana en Rust (HPC)"

[dependencies]
minifb = "0.28.0"
rand_xoshiro = "0.8.1"
rand = "0.10.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Binarios Interactivos
#[[bin]]
#name = "1_antibiograma"
#path = "src/bin/1_antibiograma.rs"

[[bin]]
name = "2_quimiostato_ode"
path = "src/bin/2_quimiostato_ode.rs"

[[bin]]
name = "3_placa_mega"
path = "src/bin/3_placa_mega.rs"